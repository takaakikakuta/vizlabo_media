# Amplify Hosting のビルド定義（Gen2 フルスタック / Next.js SSR）。
# backendフェーズで amplify/ の定義をデプロイし、frontendフェーズでNext.jsをビルドする。
# いまのバックエンドは空（defineBackend({})）。DBを足すときは amplify/data/resource.ts を追加。
# 環境変数を本番導入するときは、SSRランタイムには届かないため
# next.config.ts の env で焼き込むこと（ビルド時定数になる点に注意）。
version: 1
backend:
  phases:
    build:
      commands:
        # npm install を使う（npm ci でも入るが、下の注意を参照）。
        # 注意: @aws-amplify/data-construct のバンドル依存の扱いが npm ci と npm install で食い違う。
        # package-lock.json には npm ci が要求する入れ子の項目（@opentelemetry/core@2.0.0 ×4）を手で足してあり、
        # npm install を走らせるとその4項目が lock から消えて npm ci が再び失敗する。
        # ローカルで npm install した後の package-lock.json の差分はコミットしないこと。
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
        # ビルドキャッシュは成果物サイズ制限（220MB）に含めない
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
